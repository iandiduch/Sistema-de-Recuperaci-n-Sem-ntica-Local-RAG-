[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    integration: Pruebas de integración que requieren credenciales o llamadas a APIs externas.
    unit: Pruebas unitarias aisladas y deterministas.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
